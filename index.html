<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Дыхание Звука — Поместье Звука</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Marck+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg-image" id="bgImage" aria-hidden="true"></div>

  <div class="haze" aria-hidden="true"></div>

  <button class="menu-toggle" id="menuToggle" type="button" aria-label="Открыть меню">
    <span></span><span></span><span></span>
  </button>

  <aside class="side-nav" id="sideNav" aria-label="Навигация по сайту">
    <div class="side-nav__brand" id="brandHome" role="button" tabindex="0">
      <img class="brand-mark" src="assets/logo.jpg" alt="">
      <div class="side-nav__title">
        <span class="side-nav__eyebrow">Поместье Звука</span>
        <strong>Дыхание Звука</strong>
      </div>
    </div>
    <nav class="side-nav__links" id="navLinks"></nav>
    <div class="side-nav__footnote">резонанс держит строй</div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="stage" id="stage">
    <div class="util-bar" id="utilBar"></div>

    <section class="hero" id="hero">
      <svg class="hero__waves" viewBox="0 0 400 800" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
        <circle cx="330" cy="260" r="40" class="wave-ring wave-ring--a"/>
        <circle cx="330" cy="260" r="90" class="wave-ring wave-ring--b"/>
        <circle cx="330" cy="260" r="150" class="wave-ring wave-ring--c"/>
        <circle cx="330" cy="260" r="6" class="wave-core"/>
        <circle cx="130" cy="560" r="28" class="wave-ring wave-ring--a"/>
        <circle cx="130" cy="560" r="66" class="wave-ring wave-ring--b"/>
        <circle cx="130" cy="560" r="4" class="wave-core"/>
      </svg>
      <span class="hero__spark" style="width:5px;height:5px;top:18%;right:22%;animation-delay:.2s;"></span>
      <span class="hero__spark" style="width:3px;height:3px;top:38%;right:8%;animation-delay:1.1s;"></span>
      <span class="hero__spark" style="width:4px;height:4px;top:62%;right:30%;animation-delay:2s;"></span>
      <span class="hero__spark" style="width:3px;height:3px;top:78%;right:14%;animation-delay:.7s;"></span>
      <p class="hero__eyebrow">Поместье Хашира Звука</p>
      <h1 class="hero__title">Дыхание Звука</h1>
      <p class="hero__byline">удар, <span>эхо</span> и ритм битвы</p>
      <p class="hero__quote">«Звук не просто слышат — его чувствуют кожей. Каждый удар клинка — такт, каждая победа — новая нота».</p>
      <button class="hero__cta" id="heroCta" type="button">Войти в поместье</button>
    </section>

    <section class="page" id="pageView" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
